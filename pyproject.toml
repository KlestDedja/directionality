[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edgehog-directionality"
version = "0.1.0"
description = "Fiber directionality and dispersion analysis with EDGEHOG"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["THIRD_PARTY_NOTICES.txt"]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "scikit-image>=0.23,<0.26",
    "matplotlib>=3.6",
    "imagecodecs",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "ruff"]
notebook = ["ipykernel"]

[project.scripts]
edgehog = "main_code.cli_run_wrapper:main"

[project.urls]
Repository = "https://github.com/KlestDedja/directionality"

[tool.setuptools]
packages = ["main_code", "edgehog"]

[tool.setuptools.package-data]
main_code = ["default_params.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
