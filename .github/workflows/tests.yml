name: Install and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - name: Install built wheel and test dependencies
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', glob.glob('dist/*.whl')[0] + '[dev]'])"
      - run: python -m pip check
      - name: Test installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -m pytest "${{ github.workspace }}/tests" --import-mode=importlib -q
      - run: edgehog --help

  scikit-image-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scikit-image: ['0.23.2', '0.24.0']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" "scikit-image==${{ matrix.scikit-image }}"
      - run: python -m pytest -q
